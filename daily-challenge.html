<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Essential Arabic Learning — Daily Challenge</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Amiri:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#1B5E3F; --green-deep:#123F2A; --gold:#C6A24D; --gold-soft:#E4DCC8;
    --paper:#FBF8F1; --card:#FFFFFF; --ink:#2A2A28; --ink-soft:#6B655A;
    --red:#B3452F; --red-soft:#F6E3DE;
    --shadow: 0 1px 2px rgba(30,25,10,.04), 0 8px 24px rgba(30,25,10,.07);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(198,162,77,.08), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(27,94,63,.06), transparent 45%);
    font-family:'Inter',sans-serif; color:var(--ink); min-height:100vh;
    padding:0 0 60px;
  }
  .shell{max-width:640px;margin:0 auto;padding:0 20px;}

  .navbar{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--card);box-shadow:var(--shadow);
    padding:12px 20px;margin-bottom:24px;
  }
  .navbar .brand span{font-family:'Cormorant Garamond',serif;font-weight:700;color:var(--green-deep);font-size:15px;}
  .lang-toggle{
    background:var(--gold-soft);color:var(--green-deep);border:none;
    padding:6px 14px;border-radius:20px;font-size:12.5px;font-weight:800;
    cursor:pointer;font-family:'Inter',sans-serif;transition:background .15s ease;
  }
  .lang-toggle:hover{background:var(--gold);color:#fff;}

  .challenge-card{
    background:var(--card);border-radius:16px;box-shadow:var(--shadow);
    border:1px solid rgba(27,94,63,.08);padding:32px 28px;
  }
  .cs-badge{
    display:inline-block;background:var(--gold-soft);color:var(--green-deep);
    font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;
    padding:6px 16px;border-radius:20px;
  }
  .card-header{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:16px;gap:10px;flex-wrap:wrap;
  }
  .streak-pill{
    display:inline-flex;align-items:center;gap:6px;background:var(--green-deep);
    color:#fff;font-size:12.5px;font-weight:800;padding:6px 14px;border-radius:20px;
    white-space:nowrap;
  }
  .streak-pill .flame{font-size:14px;}

  .student-bar{
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
    background:var(--paper);border:1px solid var(--gold-soft);border-radius:10px;
    padding:9px 14px;margin-bottom:18px;font-size:12.5px;color:var(--ink-soft);
  }
  .student-bar strong{color:var(--green-deep);font-weight:800;}
  .student-bar .edit-link{
    background:none;border:none;color:var(--green);font-weight:800;font-size:12px;
    cursor:pointer;padding:0;font-family:'Inter',sans-serif;
  }
  .student-bar .edit-link:hover{text-decoration:underline;}

  .student-form{display:grid;gap:14px;padding-top:4px;}
  .field-group{display:grid;gap:6px;text-align:left;}
  .field-group label{
    font-size:12px;font-weight:700;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:.4px;
  }
  .field-group input{
    border:1.5px solid var(--gold-soft);border-radius:8px;padding:11px 13px;
    font-size:14px;font-family:'Inter',sans-serif;color:var(--ink);background:var(--paper);
  }
  .field-group input:focus{outline:none;border-color:var(--green);}
  .form-error{color:var(--red);font-size:12.5px;font-weight:600;min-height:16px;text-align:center;}

  html[dir="rtl"] .field-group{text-align:right;}

  .certificate-wrap{padding:2px 0;}
  .certificate{
    border:3px double var(--gold);border-radius:12px;padding:36px 24px;
    text-align:center;position:relative;
    background:
      radial-gradient(circle at 10% 10%, rgba(198,162,77,.10), transparent 40%),
      radial-gradient(circle at 90% 90%, rgba(27,94,63,.07), transparent 45%),
      var(--card);
  }
  .cert-emblem{margin-bottom:12px;}
  .cert-emblem img{height:52px;width:auto;}
  .cert-heading{
    font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;
    color:var(--green-deep);letter-spacing:.6px;margin-bottom:6px;text-transform:uppercase;
  }
  .cert-sub{font-size:12px;color:var(--ink-soft);margin-bottom:14px;}
  .cert-name{
    font-family:'Cormorant Garamond',serif;font-style:italic;font-size:32px;
    color:var(--green-deep);border-bottom:1.5px solid var(--gold-soft);
    display:inline-block;padding:0 20px 8px;margin-bottom:10px;
  }
  .cert-meta{font-size:12px;color:var(--ink-soft);margin-bottom:16px;}
  .cert-body{font-size:13.5px;color:var(--ink);max-width:400px;margin:0 auto 22px;line-height:1.8;}
  .cert-stats{display:flex;justify-content:center;gap:36px;margin-bottom:18px;}
  .cert-stat{display:flex;flex-direction:column;align-items:center;}
  .cert-stat-num{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:700;color:var(--green-deep);}
  .cert-stat-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft);margin-top:2px;}
  .cert-date{font-size:11.5px;color:var(--ink-soft);}
  .cert-actions{display:flex;gap:10px;margin-top:20px;}
  .cert-btn{
    flex:1;border:none;border-radius:10px;padding:12px;font-size:13.5px;
    font-weight:800;cursor:pointer;font-family:'Inter',sans-serif;transition:background .15s ease;
  }
  .cert-btn.secondary{background:var(--gold-soft);color:var(--green-deep);}
  .cert-btn.secondary:hover{background:var(--gold);color:#fff;}
  .cert-btn.primary{background:var(--green);color:#fff;}
  .cert-btn.primary:hover{background:var(--green-deep);}

  @media print{
    .navbar, .card-header, .student-bar, .cert-actions{display:none !important;}
    body{background:#fff;padding:0;}
    .shell{max-width:100%;padding:0;}
    .challenge-card{box-shadow:none;border:none;padding:0;}
    .certificate{border-width:4px;}
  }
  .progress-row{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
  .progress-track{flex:1;height:6px;background:var(--gold-soft);border-radius:6px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--green);border-radius:6px;transition:width .35s ease;}
  .progress-label{font-size:12px;font-weight:700;color:var(--ink-soft);white-space:nowrap;}

  .q-arabic{
    font-family:'Amiri',serif;font-size:56px;text-align:center;color:var(--green-deep);
    margin:10px 0 4px;line-height:1.3;
  }
  .q-translit{text-align:center;color:var(--ink-soft);font-size:13px;margin-bottom:28px;font-style:italic;}
  .q-prompt{text-align:center;font-size:13px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin-bottom:6px;}

  .options{display:grid;gap:10px;margin-top:18px;}
  .option-btn{
    background:var(--paper);border:1.5px solid var(--gold-soft);border-radius:10px;
    padding:13px 16px;font-size:15px;font-weight:600;color:var(--ink);
    text-align:left;cursor:pointer;font-family:'Inter',sans-serif;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .option-btn:hover:not(:disabled){border-color:var(--green);background:#fff;}
  .option-btn:active:not(:disabled){transform:scale(.99);}
  .option-btn:disabled{cursor:default;}
  .option-btn.correct{background:#E9F3EC;border-color:var(--green);color:var(--green-deep);}
  .option-btn.wrong{background:var(--red-soft);border-color:var(--red);color:var(--red);}

  .feedback{
    margin-top:16px;font-size:13.5px;font-weight:700;text-align:center;min-height:18px;
  }
  .feedback.correct{color:var(--green-deep);}
  .feedback.wrong{color:var(--red);}

  .next-btn{
    display:block;width:100%;margin-top:20px;background:var(--green);color:#fff;
    border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:800;
    cursor:pointer;font-family:'Inter',sans-serif;opacity:0;pointer-events:none;
    transition:opacity .2s ease, background .15s ease;
  }
  .next-btn.show{opacity:1;pointer-events:auto;}
  .next-btn:hover{background:var(--green-deep);}

  .summary{text-align:center;padding:20px 0;}
  .summary-score{font-family:'Cormorant Garamond',serif;font-size:52px;font-weight:700;color:var(--green-deep);}
  .summary-sub{color:var(--ink-soft);font-size:14px;margin-top:6px;}
  .summary-list{margin:26px 0;text-align:left;display:grid;gap:8px;}
  .summary-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 14px;border-radius:8px;background:var(--paper);font-size:13.5px;
  }
  .summary-item .sw{font-family:'Amiri',serif;font-size:17px;color:var(--green-deep);}
  .summary-item .mark{font-weight:800;}
  .summary-item.ok .mark{color:var(--green);}
  .summary-item.bad .mark{color:var(--red);}
  .done-note{font-size:13px;color:var(--ink-soft);margin-top:10px;}

  html[dir="rtl"] body{font-family:'Amiri',serif;}
  html[dir="rtl"] .option-btn{text-align:right;}
  html[dir="rtl"] .summary-item{flex-direction:row-reverse;}
</style>
</head>
<body>
<div class="shell">

    <div class="brand"><span>Essential Arabic Learning</span></div>

    </div>
    <div class="student-bar" id="studentBar" style="display:none;"></div>
    <div id="quizArea"></div>
  </div>
</div>

const CHALLENGE_SIZE = 5;
/* A certificate is awarded every time the streak completes a full lap of
   the word bank (200 words ÷ 5/day = 40 days). If the bank size changes
   later, this stays correct automatically. */
const CERTIFICATE_MILESTONE = WORD_BANK.length / CHALLENGE_SIZE;

/* ---------- Deterministic daily selection ---------- */
/* Picks a rotating slice of the bank so today's 5 words differ from
   tomorrow's, and the full bank cycles before repeating. */
function dayOfEpoch(){
  const now = new Date();
  const utcMidnight = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.floor(utcMidnight / 86400000);
}

/* ---------- Cloud sync (Google Sheet via Apps Script) ---------- */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxwTWs2_X8ffGFbMQsFKXQhzcYQnM4NvXvA8UgP-me_6AhxlqnQbqNvW1cLKRCmlr9oiA/exec';

/* Pulls this student's saved streak from the Sheet (if any) and overwrites
   local data with it, so the same Roll# picks up progress on any device.
   Falls back silently to whatever is already in localStorage if the
   network call fails (offline, blocked, etc). */
async function syncFromCloud(){
  if(!studentInfo || !studentInfo.roll) return;
  try {
    const res = await fetch(`${APPS_SCRIPT_URL}?roll=${encodeURIComponent(studentInfo.roll)}`);
    const data = await res.json();
    if(data && data.found){
      streakData = {
        currentStreak: Number(data.currentStreak) || 0,
        longestStreak: Number(data.longestStreak) || 0,
        lastCompletedDay: (data.lastCompletedDay === null || data.lastCompletedDay === undefined) ? null : Number(data.lastCompletedDay),
        lastScore: (data.lastScore === null || data.lastScore === undefined) ? null : Number(data.lastScore)
      };
      saveStreak(streakData);
    }
  } catch(e){
    console.error('Cloud sync failed, using local data', e);
  }
}

/* Pushes the latest streak up to the Sheet. Fire-and-forget: local data is
   already updated and shown, so a failed/slow request doesn't block the UI. */
function pushToCloud(){
  if(!studentInfo || !studentInfo.roll) return;
  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({
      roll: studentInfo.roll,
      name: studentInfo.name,
      course: studentInfo.course,
      currentStreak: streakData.currentStreak,
      longestStreak: streakData.longestStreak,
      lastCompletedDay: streakData.lastCompletedDay,
      lastScore: streakData.lastScore,
      certificatesEarned: streakData.certificatesEarned
    })
  }).catch(e => console.error('Cloud save failed', e));
}

/* ---------- Streak storage (saved in this browser only) ---------- */
const STREAK_KEY = 'eal_daily_streak_v1';

function loadStreak(){
  try {
    const raw = localStorage.getItem(STREAK_KEY);
    if(!raw) return { currentStreak:0, longestStreak:0, lastCompletedDay:null, lastScore:null, cycleCorrect:0, cycleTotal:0, certificatesEarned:0, lastCertificate:null };
    const parsed = JSON.parse(raw);
    return {
      currentStreak: parsed.currentStreak || 0,
      longestStreak: parsed.longestStreak || 0,
      lastCompletedDay: typeof parsed.lastCompletedDay === 'number' ? parsed.lastCompletedDay : null,
      lastScore: typeof parsed.lastScore === 'number' ? parsed.lastScore : null,
      cycleCorrect: parsed.cycleCorrect || 0,
      cycleTotal: parsed.cycleTotal || 0,
      certificatesEarned: parsed.certificatesEarned || 0,
      lastCertificate: parsed.lastCertificate || null
    };
  } catch(e){
    return { currentStreak:0, longestStreak:0, lastCompletedDay:null, lastScore:null, cycleCorrect:0, cycleTotal:0, certificatesEarned:0, lastCertificate:null };
  }
}

function saveStreak(data){
  try { localStorage.setItem(STREAK_KEY, JSON.stringify(data)); } catch(e){ /* storage unavailable, fail silently */ }
}

let streakData = loadStreak();

/* Call once when a challenge is finished. Increments the streak if the
   previous completion was yesterday, resets to 1 after a gap, and leaves
   it untouched if today was already completed (e.g. a replay). */
function registerCompletion(score){
  const today = dayOfEpoch();
  if(streakData.lastCompletedDay === today){
    streakData.lastScore = score;
  } else if(streakData.lastCompletedDay === today - 1){
    streakData.currentStreak += 1;
    streakData.cycleCorrect += score;
    streakData.cycleTotal += CHALLENGE_SIZE;
    streakData.lastScore = score;
  } else {
    streakData.currentStreak = 1;
    streakData.cycleCorrect = score;
    streakData.cycleTotal = CHALLENGE_SIZE;
    streakData.lastScore = score;
  }
  streakData.longestStreak = Math.max(streakData.longestStreak, streakData.currentStreak);
  streakData.lastCompletedDay = today;

  let milestoneReached = false;
  if(streakData.currentStreak > 0 && streakData.currentStreak % CERTIFICATE_MILESTONE === 0){
    milestoneReached = true;
    const accuracy = streakData.cycleTotal > 0 ? Math.round((streakData.cycleCorrect / streakData.cycleTotal) * 100) : 0;
    streakData.certificatesEarned = (streakData.certificatesEarned || 0) + 1;
    streakData.lastCertificate = {
      streakDays: streakData.currentStreak,
      accuracy: accuracy,
      date: new Date().toISOString().slice(0, 10)
    };
    // Reset cycle counters so the next certificate measures the next lap.
    streakData.cycleCorrect = 0;
    streakData.cycleTotal = 0;
  }

  saveStreak(streakData);
  renderStreakPill();
  pushToCloud();
  return milestoneReached;
}

function renderStreakPill(){
  const textEl = document.getElementById('streakText');
  if(!textEl) return;
  const n = streakData.currentStreak;
  textEl.textContent = lang === 'ar'
    ? `${n} ${n === 1 ? 'يوم متتالي' : 'أيام متتالية'}`
    : `${n} ${n === 1 ? 'Day' : 'Days'}`;
}

function hasCompletedToday(){
  return streakData.lastCompletedDay === dayOfEpoch();
}

function getDailyWords(){
  const start = (dayOfEpoch() * CHALLENGE_SIZE) % WORD_BANK.length;
  const words = [];
  for(let i = 0; i < CHALLENGE_SIZE; i++){
    words.push(WORD_BANK[(start + i) % WORD_BANK.length]);
  }
  return words;
}

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildOptions(correctWord){
  const distractors = shuffle(WORD_BANK.filter(w => w.en !== correctWord.en)).slice(0, 3);
  return shuffle([correctWord, ...distractors]);
}

/* ---------- Quiz state ---------- */
const questions = getDailyWords();
let qIndex = 0;
let answered = false;
const results = []; // { word, chosenEn, isCorrect }

const quizArea = document.getElementById('quizArea');

function render(){
  if(qIndex >= questions.length){
    renderSummary();
    return;
  }
  const word = questions[qIndex];
  const options = buildOptions(word);
  answered = false;

  quizArea.innerHTML = `
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" style="width:${(qIndex/questions.length)*100}%"></div></div>
      <div class="progress-label">${qIndex+1} / ${questions.length}</div>
    </div>
    <div class="q-prompt" data-key="prompt">What does this word mean?</div>
    <div class="q-arabic">${word.ar}</div>
    <div class="q-translit">${word.tr}</div>
    <div class="options" id="optionsArea"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn" data-key="next">Next</button>
  `;

  const optionsArea = document.getElementById('optionsArea');
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt.en;
    btn.addEventListener('click', () => selectAnswer(opt, word, btn, optionsArea));
    optionsArea.appendChild(btn);
  });

  document.getElementById('nextBtn').addEventListener('click', () => {
    qIndex++;
    render();
  });

  applyLanguage();
}

function selectAnswer(chosen, correctWord, btnEl, optionsArea){
  if(answered) return;
  answered = true;
  const isCorrect = chosen.en === correctWord.en;

  [...optionsArea.children].forEach(btn => {
    btn.disabled = true;
    if(btn.textContent === correctWord.en) btn.classList.add('correct');
    else if(btn === btnEl && !isCorrect) btn.classList.add('wrong');
  });

  const feedback = document.getElementById('feedback');
  feedback.textContent = isCorrect
    ? (lang === 'ar' ? 'صحيح! 👏' : 'Correct! 👏')
    : (lang === 'ar' ? `غير صحيح — الصحيح: ${correctWord.en}` : `Not quite — it means "${correctWord.en}"`);
  feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'wrong');

  document.getElementById('nextBtn').classList.add('show');

  results.push({ word: correctWord, isCorrect });
}

function renderSummary(){
  const score = results.filter(r => r.isCorrect).length;
  const milestoneReached = registerCompletion(score);

  if(milestoneReached && streakData.lastCertificate){
    renderCertificate(streakData.lastCertificate);
    return;
  }

  const listHtml = results.map(r => `
    <div class="summary-item ${r.isCorrect ? 'ok' : 'bad'}">
      <span class="sw">${r.word.ar} <span style="font-family:'Inter',sans-serif;font-size:12px;color:var(--ink-soft);">— ${r.word.en}</span></span>
      <span class="mark">${r.isCorrect ? '✓' : '✗'}</span>
    </div>
  `).join('');

  quizArea.innerHTML = `
    <div class="summary">
      <div class="summary-score">${score}/${questions.length}</div>
      <div class="summary-sub" data-key="summarySub">Today's challenge complete</div>
      <div class="summary-list">${listHtml}</div>
      <div class="done-note" data-key="doneNote">Come back tomorrow for 5 new words.</div>
    </div>
  `;
  applyLanguage();
}

function renderAlreadyDone(){
  quizArea.innerHTML = `
    <div class="summary">
      <div class="summary-score">${streakData.lastScore ?? '—'}/${CHALLENGE_SIZE}</div>
      <div class="summary-sub" data-key="alreadyDoneSub">You already completed today's challenge</div>
      <div class="done-note" data-key="doneNote">Come back tomorrow for 5 new words.</div>
    </div>
  `;
  applyLanguage();
}

function renderCertificate(cert){
  const bodyText = lang === 'ar'
    ? `لإتمام سلسلة تحدي يومي لمدة ${cert.streakDays} يومًا في منصة Essential Arabic Learning`
    : `for successfully completing a ${cert.streakDays}-day Daily Challenge streak on Essential Arabic Learning`;
  const metaText = `${lang === 'ar' ? 'الرقم الجامعي' : 'Roll#'} ${studentInfo.roll} · ${studentInfo.course}`;
  const dateText = `${lang === 'ar' ? 'التاريخ' : 'Date'}: ${cert.date}`;

  quizArea.innerHTML = `
    <div class="certificate-wrap">
      <div class="certificate" id="certificateEl">
        <div class="cert-emblem"><img src="${LOGO_DATA_URI}" alt="Essential Arabic Learning"></div>
        <div class="cert-heading" data-key="certTitle">Certificate of Completion</div>
        <div class="cert-sub" data-key="certPresented">This certificate is proudly presented to</div>
        <div class="cert-name">${studentInfo.name}</div>
        <div class="cert-meta">${metaText}</div>
        <div class="cert-body">${bodyText}</div>
        <div class="cert-stats">
          <div class="cert-stat">
            <span class="cert-stat-num">${cert.streakDays}</span>
            <span class="cert-stat-label" data-key="certDaysLabel">Days Streak</span>
          </div>
          <div class="cert-stat">
            <span class="cert-stat-num">${cert.accuracy}%</span>
            <span class="cert-stat-label" data-key="certScoreLabel">Overall Score</span>
          </div>
        </div>
        <div class="cert-date">${dateText}</div>
      </div>
      <div class="cert-actions">
        <button class="cert-btn secondary" id="printCertBtn" data-key="certPrint">Print / Save as PDF</button>
        <button class="cert-btn primary" id="certContinueBtn" data-key="certContinue">Continue</button>
      </div>
    </div>
  `;
  document.getElementById('printCertBtn').addEventListener('click', () => window.print());
  document.getElementById('certContinueBtn').addEventListener('click', () => {
    if(hasCompletedToday()){ renderAlreadyDone(); } else { render(); }
  });
  applyLanguage();
}

let lang = 'en';
const langToggle = document.getElementById('langToggle');

function applyLanguage(){
  document.documentElement.lang = lang === 'ar' ? 'ar' : 'en';
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-key]').forEach(el => {
    const key = el.getAttribute('data-key');
    if(translations[lang][key] !== undefined) el.textContent = translations[lang][key];
  });
  langToggle.textContent = lang === 'ar' ? 'English' : 'العربية';
  renderStreakPill();
  renderStudentBar();
}

langToggle.addEventListener('click', () => {
  lang = lang === 'ar' ? 'en' : 'ar';
  applyLanguage();
});

if(studentInfo){
  startChallengeFlow();
} else {
  renderStudentForm(false);
  renderStreakPill();
}
